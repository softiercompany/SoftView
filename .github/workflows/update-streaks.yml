name: Update Daily User Streaks Cron

on:
  schedule:
    # Runs daily at 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-streaks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Day Streaks Update API
        run: |
          echo "Triggering SoftView Day Streaks Calculation Cron..."
          APP_DOMAIN="${{ secrets.APP_DOMAIN || 'https://softview.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$APP_DOMAIN/api/cron/update-streaks" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
            
          echo "Response Output:"
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Day Streaks Updated Successfully!"
          else
            echo "⚠️ Non-200 HTTP response received during streak cron execution."
          fi
